<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4b1f6f">
<title>Josh's Gym Plan</title>
<link rel="manifest" href="manifest.webmanifest?v=15">
<link rel="icon" href="app-icon.svg?v=15" type="image/svg+xml">
<link rel="apple-touch-icon" href="app-icon.svg?v=15">
<style>
:root{--bg:#0e0e12;--card:#19191f;--card2:#23202a;--text:#fff;--muted:#a7a7b0;--accent:#7b3fb8;--accent2:#b78ae0;--ok:#2f9e44;--danger:#b42318;--line:#332c3a}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#251134,#0e0e12 34%);color:var(--text)}
.wrap{max-width:880px;margin:auto;padding:16px 14px 105px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}h1{font-size:1.7rem;margin:6px 0}.sub,.meta,.tiny{color:var(--muted)}.tiny{font-size:.8rem}
.navtabs{display:flex;gap:8px;overflow:auto;padding:12px 0}.navtab{border:0;border-radius:999px;padding:10px 14px;background:#2a2530;color:#ddd;white-space:nowrap}.active{background:var(--accent)!important;color:#fff!important}
.card{background:rgba(25,25,31,.98);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 8px 22px rgba(0,0,0,.22)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:var(--card2);border-radius:14px;padding:12px}.big{font-size:1.65rem;font-weight:800}.sectionTitle{font-size:1.05rem;font-weight:800;margin-bottom:4px}
.exercise{padding:12px 0;border-top:1px solid #2f2a34}.exercise:first-child{border-top:0}.exerciseHead{display:flex;justify-content:space-between;gap:12px;align-items:center;cursor:pointer;padding:4px 0}.exerciseHeadMain{min-width:0}.chev{font-size:1.2rem;color:var(--accent2);transition:transform .18s ease}.exercise.open .chev{transform:rotate(90deg)}.exerciseBody{display:none;padding-top:8px}.exercise.open .exerciseBody{display:block}.row{display:grid;grid-template-columns:1fr 82px 82px 42px;gap:8px;align-items:center;margin-top:10px}.setrow{display:grid;grid-template-columns:42px 1fr 1fr 46px;gap:8px;align-items:center;margin-top:8px}.setnum{text-align:center;font-weight:800;color:var(--accent2)}.setupbox{margin-top:10px;padding:10px;border-radius:12px;background:#151219;border:1px solid #2f2935}.dashboard{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.timerbar{position:sticky;top:0;z-index:50;background:#18131eee;border:1px solid #3a2f45;border-radius:14px;padding:10px;margin:8px 0;backdrop-filter:blur(10px)}
input,textarea,select{width:100%;padding:10px;border-radius:10px;border:1px solid #444;background:#121217;color:#fff}.check{width:36px;height:36px;border-radius:10px;border:1px solid #555;background:#18181d;color:#fff;font-size:18px}.check.done{background:var(--ok);border-color:var(--ok)}
.btn{border:0;border-radius:12px;padding:12px;background:var(--accent);color:#fff;font-weight:700}.secondary{background:#2b2830}.danger{background:var(--danger)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.progress{height:11px;background:#2a2a2f;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--accent2)}
.historyItem{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-top:1px solid #2d2831}.historyItem:first-child{border-top:0}.clickable{cursor:pointer}.pr{display:inline-block;background:#3d2b4e;color:#e9d5ff;border-radius:999px;padding:4px 8px;font-size:.75rem;margin-left:6px}.gain{color:#7ddc97}.loss{color:#ff9a9a}
.chartWrap{overflow-x:auto}.chart{width:100%;min-width:560px;height:210px;background:#131318;border-radius:14px;border:1px solid #29242f}.barrow{display:flex;align-items:end;gap:6px;height:160px;padding:12px}.barcol{flex:1;min-width:22px;text-align:center}.barcol span{display:block;background:linear-gradient(180deg,var(--accent2),var(--accent));border-radius:6px 6px 2px 2px;min-height:2px}.barlabel{font-size:.66rem;color:#999;margin-top:4px;white-space:nowrap}
.footer{position:fixed;left:0;right:0;bottom:0;background:#151217ee;border-top:1px solid #302736;padding:10px;backdrop-filter:blur(10px)}.footer .inner{max-width:880px;margin:auto;display:flex;gap:8px}.footer button{flex:1}
.lock{position:fixed;inset:0;background:radial-gradient(circle at top,#351747,#101013 55%);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}.lockbox{width:min(390px,100%);background:#19191f;border:1px solid #3b3243;border-radius:22px;padding:22px;text-align:center;box-shadow:0 20px 60px #0008}.pin{font-size:1.5rem;letter-spacing:.25rem;text-align:center}.hidden{display:none!important}.search{margin-bottom:10px}.tag{display:inline-block;background:#2b2631;border-radius:999px;padding:4px 8px;font-size:.75rem;color:#ddd;margin-right:5px}
@media(max-width:680px){.grid4,.grid3,.dashboard{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 72px 72px 40px}.top{flex-direction:column}}
@media(max-width:440px){.grid4,.grid3,.grid2{grid-template-columns:1fr}.row{grid-template-columns:1fr 68px 68px 38px}}
</style>
</head>
<body>
<div id="lockScreen" class="lock">
  <div class="lockbox">
    <div class="big">Josh's Gym Plan</div>
    <p class="meta">Enter your PIN to unlock.</p>
    <input id="pinInput" class="pin" inputmode="numeric" maxlength="4" type="password" autocomplete="off">
    <button class="btn" style="width:100%;margin-top:12px" onclick="unlockApp()">Unlock</button>
    <div id="pinMsg" class="tiny" style="margin-top:10px"></div>
  </div>
</div>
<div id="app" class="hidden">
<div class="wrap">
<div class="top"><div><h1>Josh's Gym Plan</h1><div class="sub">Planet Fitness • long-term progress tracking</div></div><div class="tiny" id="status"></div></div>
<div class="navtabs">
<button id="navToday" class="navtab active" onclick="view='today';render()">Today</button>
<button id="navHistory" class="navtab" onclick="view='history';render()">History</button>
<button id="navProgress" class="navtab" onclick="view='progress';render()">Progress</button>
<button id="navCompare" class="navtab" onclick="view='compare';render()">Compare</button>
<button id="navSummary" class="navtab" onclick="view='summary';render()">Monthly</button>
<button id="navData" class="navtab" onclick="view='data';render()">Backup</button>
</div>
<div id="content"></div>
</div>
<div class="footer"><div class="inner"><button class="btn secondary" onclick="goPrev()">◀ Day</button><button class="btn" onclick="goToday()">Today</button><button class="btn secondary" onclick="goNext()">Day ▶</button></div></div>
</div>
<script>
const APP_PIN="3972";
const plan={
0:{name:"Sunday",focus:"Active Recovery",ex:[["Mobility / Stretching","10-15 min"],["Easy Walk","Optional"]]},
1:{name:"Monday",focus:"Chest + Triceps",ex:[["Smith Machine Bench Press","3 x 8-10"],["Incline Chest Press Machine","3 x 10"],["Pec Deck","3 x 12"],["Cable Triceps Pushdown","3 x 12"],["Overhead Cable Triceps Extension","3 x 10"]]},
2:{name:"Tuesday",focus:"Back + Biceps",ex:[["Lat Pulldown","3 x 10"],["Seated Row Machine","3 x 10"],["Assisted Pull-Up Machine","3 x 8-10"],["Reverse Pec Deck","3 x 12"],["Cable Curl","3 x 10"],["Dumbbell Hammer Curl","3 x 10"]]},
3:{name:"Wednesday",focus:"Legs",ex:[["Leg Press","4 x 10"],["Smith Machine Squat","3 x 8-10"],["Seated Leg Curl","3 x 12"],["Leg Extension","3 x 12"],["Calf Raise on Leg Press","4 x 15"]]},
4:{name:"Thursday",focus:"Core + Recovery",ex:[["Ab Crunch Machine","3 x 12-15"],["Cable Woodchop","3 x 10/side"],["Plank","3 x 30-60 sec"],["Dead Bug","3 x 10/side"]]},
5:{name:"Friday",focus:"Shoulders + Arms",ex:[["Shoulder Press Machine","3 x 10"],["Dumbbell Lateral Raise","3 x 12"],["Reverse Pec Deck","3 x 12"],["Cable Curl","3 x 10"],["Rope Triceps Pushdown","3 x 10"],["Preacher Curl Machine","2 x 12"],["Triceps Press Machine","2 x 12"]]},
6:{name:"Saturday",focus:"Full Body",ex:[["Smith Machine Squat","3 x 8"],["Chest Press Machine","3 x 10"],["Lat Pulldown","3 x 10"],["Dumbbell Romanian Deadlift","3 x 10"],["Shoulder Press Machine","2 x 10"],["Cable Row","2 x 12"]]}
};
const storeKey="joshGymHistoryV3";
let db=JSON.parse(localStorage.getItem(storeKey)||'{"workouts":{},"bodyWeight":[],"settings":{"ellipticalGoal":60}}');
db.workouts=db.workouts||{};db.bodyWeight=db.bodyWeight||[];db.settings=db.settings||{ellipticalGoal:60};db.machineSetup=db.machineSetup||{};if(!db.settings.ellipticalGoal)db.settings.ellipticalGoal=60;if(!db.settings.waterServings)db.settings.waterServings=12;if(!db.settings.waterOzPerServing)db.settings.waterOzPerServing=10;
let currentDate=new Date();currentDate.setHours(12,0,0,0);let view="today";let historyFilter="";let restTimerEnd=0;let restTimerId=null;let openExercises=new Set();
function unlockApp(){const v=document.getElementById("pinInput").value;if(v===APP_PIN){sessionStorage.setItem("joshGymUnlocked","1");lockScreen.classList.add("hidden");app.classList.remove("hidden");render()}else{pinMsg.textContent="Incorrect PIN.";pinInput.value="";pinInput.focus()}}
function initLock(){sessionStorage.removeItem("joshGymUnlocked");lockScreen.classList.remove("hidden");app.classList.add("hidden");setTimeout(()=>pinInput.focus(),50)};document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!lockScreen.classList.contains("hidden"))unlockApp()});
function iso(d){return d.toISOString().slice(0,10)}function fmt(d){return d.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric",year:"numeric"})}
function workout(date=currentDate){const k=iso(date);if(!db.workouts[k])db.workouts[k]={date:k,elliptical:0,level:"",notes:"",completed:false,ex:{},water:[]};if(!Array.isArray(db.workouts[k].water))db.workouts[k].water=[];for(const e of Object.values(db.workouts[k].ex||{})){if(!Array.isArray(e.sets)){e.sets=[];if(e.weight||e.reps)e.sets.push({weight:e.weight||"",reps:e.reps||"",done:!!e.done})}e.setup=e.setup||""}return db.workouts[k]}
function save(){localStorage.setItem(storeKey,JSON.stringify(db))}
function esc(s){return s.replaceAll("\\","\\\\").replaceAll("'","\\'")}
function allWorkouts(){return Object.values(db.workouts).sort((a,b)=>a.date.localeCompare(b.date))}
function activeWorkout(w){return w.completed||Number(w.elliptical||0)>0||Object.values(w.ex||{}).some(e=>e.done||e.weight||e.reps)||(w.notes||"").trim()}
function previousFor(name,dateKey){return allWorkouts().filter(w=>w.date<dateKey&&w.ex?.[name]&&exerciseHasData(w.ex[name])).pop()?.ex[name]||null}
function bestFor(name,beforeDate=null){let best=null;for(const w of allWorkouts()){if(beforeDate&&w.date>=beforeDate)continue;const e=w.ex?.[name];if(!e)continue;for(const s of normalizedSets(e)){const wt=Number(s.weight||0),reps=Number(s.reps||0);if(!best||wt>best.weight||(wt===best.weight&&reps>best.reps))best={weight:wt,reps,date:w.date}}}return best}
function normalizedSets(e){if(!e)return[];if(Array.isArray(e.sets)&&e.sets.length)return e.sets;if(e.weight||e.reps)return[{weight:e.weight||"",reps:e.reps||"",done:!!e.done}];return[]}function exerciseHasData(e){return normalizedSets(e).some(s=>s.weight||s.reps||s.done)||(e?.setup||"").trim()}function vol(e){return normalizedSets(e).reduce((a,s)=>a+Number(s.weight||0)*Number(s.reps||0),0)}
function totalVolume(w){return Object.values(w.ex||{}).reduce((a,e)=>a+vol(e),0)}function exerciseSummary(e){const sets=normalizedSets(e).filter(s=>s.weight||s.reps);return sets.map(s=>(s.weight||"-")+"×"+(s.reps||"-")).join(", ")}
function currentStreak(){const set=new Set(allWorkouts().filter(activeWorkout).map(w=>w.date));let d=new Date();d.setHours(12,0,0,0);let s=0;while(set.has(iso(d))){s++;d.setDate(d.getDate()-1)}return s}
function longestStreak(){const dates=allWorkouts().filter(activeWorkout).map(w=>w.date);if(!dates.length)return 0;let best=1,cur=1;for(let i=1;i<dates.length;i++){const a=new Date(dates[i-1]+"T12:00:00"),b=new Date(dates[i]+"T12:00:00");const diff=Math.round((b-a)/86400000);if(diff===1){cur++;best=Math.max(best,cur)}else if(diff>1)cur=1}return best}
function exerciseNames(){return [...new Set(allWorkouts().flatMap(w=>Object.keys(w.ex||{})))].sort()}
function render(){["Today","History","Progress","Compare","Summary","Data"].forEach(n=>document.getElementById("nav"+n)?.classList.toggle("active",view===n.toLowerCase()));status.textContent=currentStreak()+" day streak";if(view==="today")renderToday();if(view==="history")renderHistory();if(view==="progress")renderProgress();if(view==="compare")renderCompare();if(view==="summary")renderSummary();if(view==="data")renderData()}
function renderToday(){const p=plan[currentDate.getDay()],w=workout(),goal=Number(db.settings.ellipticalGoal||60),pct=Math.min(100,Math.round(Number(w.elliptical||0)/goal*100)),waterDone=w.water.filter(Boolean).length,waterTotal=Number(db.settings.waterServings||12),exDone=p.ex.filter(([name])=>normalizedSets(w.ex?.[name]).some(s=>s.done)).length,completionPct=Math.round(exDone/Math.max(1,p.ex.length)*100);let html='<div class="card"><div class="sectionTitle">'+fmt(currentDate)+'</div><div class="meta">'+p.focus+'</div></div>';html+='<div class="dashboard"><div class="metric"><div class="meta">Elliptical</div><div class="big">'+Number(w.elliptical||0)+'</div><div class="tiny">of '+goal+' min</div></div><div class="metric"><div class="meta">Water</div><div class="big">'+waterDone+'/'+waterTotal+'</div><div class="tiny">10 oz checks</div></div><div class="metric"><div class="meta">Exercises</div><div class="big">'+exDone+'</div><div class="tiny">with a set done</div></div><div class="metric"><div class="meta">Volume</div><div class="big">'+totalVolume(w).toLocaleString()+'</div><div class="tiny">today</div></div></div>';html+=restTimerBar();html+='<div class="card"><div class="sectionTitle">Elliptical</div><div class="big">'+(w.elliptical||0)+' / '+goal+' min</div><div class="progress"><div class="bar" style="width:'+pct+'%"></div></div><div class="grid2" style="margin-top:12px"><input inputmode="numeric" placeholder="Minutes" value="'+(w.elliptical||'')+'" onchange="upd(\'elliptical\',this.value)"><input placeholder="Resistance / Level" value="'+(w.level||'')+'" onchange="upd(\'level\',this.value)"></div></div>';html+=waterCard(w);html+='<div class="card"><div class="sectionTitle">Workout</div><div class="meta">'+exDone+' of '+p.ex.length+' exercises started</div><div class="progress" style="margin:8px 0 12px"><div class="bar" style="width:'+completionPct+'%"></div></div>';for(const [name,target] of p.ex){const e=w.ex[name]||{sets:[],setup:""},prev=previousFor(name,w.date),best=bestFor(name,w.date);if(!Array.isArray(e.sets))e.sets=[];const targetSets=parseInt(target)||3;while(e.sets.length<targetSets)e.sets.push({weight:"",reps:"",done:false});let pr='';for(const s of e.sets){if(best&&(Number(s.weight||0)>best.weight||(Number(s.weight||0)===best.weight&&Number(s.reps||0)>best.reps))){pr='<span class="pr">New PR</span>';break}}const open=openExercises.has(name),doneSets=e.sets.filter(s=>s.done).length;html+='<div class="exercise '+(open?'open':'')+'"><div class="exerciseHead" onclick="toggleExercisePanel(\''+esc(name)+'\')"><div class="exerciseHeadMain"><div><b>'+name+'</b>'+pr+'</div><div class="meta">'+target+' • '+doneSets+'/'+e.sets.length+' sets'+(best?' • Best: '+best.weight+' lb × '+best.reps:'')+'</div></div><div class="chev">▶</div></div><div class="exerciseBody"><div class="meta">'+(prev?'Last: '+exerciseSummary(prev):'No previous set data yet')+(vol(e)?' • Volume: '+vol(e).toLocaleString():'')+'</div><div class="setupbox"><div class="tiny">Machine setup memory</div><input placeholder="Seat / pin / handle notes" value="'+((db.machineSetup[name]||e.setup||'')).replaceAll('"','&quot;')+'" onchange="updSetup(\''+esc(name)+'\',this.value)"></div>';for(let i=0;i<e.sets.length;i++){const s=e.sets[i];html+='<div class="setrow"><div class="setnum">'+(i+1)+'</div><input inputmode="decimal" placeholder="'+((normalizedSets(prev)[i]?.weight)?'Last '+normalizedSets(prev)[i].weight+' lb':'Weight')+'" value="'+(s.weight||'')+'" onchange="updSet(\''+esc(name)+'\','+i+',\'weight\',this.value)"><input inputmode="numeric" placeholder="'+((normalizedSets(prev)[i]?.reps)?'Last '+normalizedSets(prev)[i].reps+' reps':'Reps')+'" value="'+(s.reps||'')+'" onchange="updSet(\''+esc(name)+'\','+i+',\'reps\',this.value)"><button class="check '+(s.done?'done':'')+'" onclick="toggleSet(\''+esc(name)+'\','+i+')">'+(s.done?'✓':'')+'</button></div>'}html+='<div class="actions" style="margin-top:10px"><button class="btn secondary" onclick="addSet(\''+esc(name)+'\')">+ Set</button><button class="btn secondary" onclick="startRest(90)">Rest 90s</button></div></div></div>'}html+='</div><div class="card"><div class="sectionTitle">Notes</div><textarea placeholder="How did the workout feel?" onchange="upd(\'notes\',this.value)">'+(w.notes||'')+'</textarea><div class="actions" style="margin-top:10px"><button class="btn secondary" onclick="clearDate()">Clear Date</button><button class="btn" onclick="finish()">Finish Workout</button></div></div>';content.innerHTML=html}
function toggleExercisePanel(n){if(openExercises.has(n))openExercises.delete(n);else openExercises.add(n);renderToday()}function restTimerBar(){if(!restTimerEnd)return '<div class="timerbar"><div class="grid3"><button class="btn secondary" onclick="startRest(60)">60s Rest</button><button class="btn secondary" onclick="startRest(90)">90s Rest</button><button class="btn secondary" onclick="startRest(120)">120s Rest</button></div></div>';const left=Math.max(0,Math.ceil((restTimerEnd-Date.now())/1000));return '<div class="timerbar"><div class="sectionTitle">Rest Timer</div><div class="big" id="restClock">'+left+'s</div><button class="btn secondary" style="margin-top:8px" onclick="cancelRest()">Cancel</button></div>'}
function startRest(sec){restTimerEnd=Date.now()+sec*1000;if(restTimerId)clearInterval(restTimerId);restTimerId=setInterval(()=>{const el=document.getElementById("restClock");const left=Math.max(0,Math.ceil((restTimerEnd-Date.now())/1000));if(el)el.textContent=left+"s";if(left<=0){clearInterval(restTimerId);restTimerId=null;restTimerEnd=0;if(navigator.vibrate)navigator.vibrate([200,100,200]);renderToday()}},250);renderToday()}
function cancelRest(){if(restTimerId)clearInterval(restTimerId);restTimerId=null;restTimerEnd=0;renderToday()}
function updSet(n,i,k,v){const w=workout();w.ex[n]=w.ex[n]||{sets:[],setup:""};w.ex[n].sets=w.ex[n].sets||[];while(w.ex[n].sets.length<=i)w.ex[n].sets.push({weight:"",reps:"",done:false});w.ex[n].sets[i][k]=v;save()}
function toggleSet(n,i){const w=workout();w.ex[n]=w.ex[n]||{sets:[],setup:""};w.ex[n].sets=w.ex[n].sets||[];while(w.ex[n].sets.length<=i)w.ex[n].sets.push({weight:"",reps:"",done:false});w.ex[n].sets[i].done=!w.ex[n].sets[i].done;save();if(w.ex[n].sets[i].done)startRest(90);else renderToday()}
function addSet(n){const w=workout();w.ex[n]=w.ex[n]||{sets:[],setup:""};w.ex[n].sets=w.ex[n].sets||[];w.ex[n].sets.push({weight:"",reps:"",done:false});save();renderToday()}
function updSetup(n,v){const w=workout();w.ex[n]=w.ex[n]||{sets:[],setup:""};w.ex[n].setup=v;db.machineSetup[n]=v;save()}
function waterCard(w){const servings=Number(db.settings.waterServings||12),oz=Number(db.settings.waterOzPerServing||10);while(w.water.length<servings)w.water.push(false);if(w.water.length>servings)w.water=w.water.slice(0,servings);const done=w.water.filter(Boolean).length,total=servings*oz,pct=Math.round(done/servings*100);let boxes="";for(let i=0;i<servings;i++)boxes+='<button class="check '+(w.water[i]?'done':'')+'" style="width:46px;height:46px;margin:4px" onclick="toggleWater('+i+')">'+(w.water[i]?'✓':(i+1))+'</button>';return '<div class="card"><div class="sectionTitle">Water</div><div class="big">'+(done*oz)+' / '+total+' oz</div><div class="meta">'+done+' of '+servings+' servings • '+oz+' oz each</div><div class="progress" style="margin-top:10px"><div class="bar" style="width:'+pct+'%"></div></div><div style="margin-top:8px">'+boxes+'</div><button class="btn secondary" style="width:100%;margin-top:10px" onclick="addWater10()">+10 oz</button></div>'}function toggleWater(i){const w=workout();w.water[i]=!w.water[i];save();renderToday()}function addWater10(){const w=workout(),servings=Number(db.settings.waterServings||12);while(w.water.length<servings)w.water.push(false);const i=w.water.findIndex(x=>!x);if(i>=0)w.water[i]=true;save();renderToday()}function renderHistory(){const ws=allWorkouts().filter(activeWorkout).slice().reverse();let html='<div class="card"><div class="sectionTitle">Workout History</div><input class="search" placeholder="Search by exercise or date..." value="'+historyFilter+'" oninput="historyFilter=this.value;renderHistory()"><div class="meta">Tap any day to reopen the full workout.</div>';const q=historyFilter.trim().toLowerCase();const filtered=ws.filter(w=>!q||w.date.includes(q)||Object.keys(w.ex||{}).some(n=>n.toLowerCase().includes(q))||(w.notes||"").toLowerCase().includes(q));if(!filtered.length)html+='<p class="meta">No matching workouts.</p>';for(const w of filtered){const d=new Date(w.date+"T12:00:00"),names=Object.keys(w.ex||{}).filter(n=>{const e=w.ex[n];return e.done||e.weight||e.reps});html+='<div class="historyItem clickable" onclick="openDate(\''+w.date+'\')"><div><b>'+fmt(d)+'</b><div class="meta">'+plan[d.getDay()].focus+' • '+names.length+' exercises • '+totalVolume(w).toLocaleString()+' volume</div></div><div style="text-align:right"><b>'+Number(w.elliptical||0)+' min</b><div class="meta">'+(w.completed?'Completed ✓':'Saved')+'</div></div></div>'}html+='</div>';content.innerHTML=html}
function progressSeries(name){return allWorkouts().filter(w=>w.ex?.[name]&&exerciseHasData(w.ex[name])).map(w=>{const sets=normalizedSets(w.ex[name]);const top=sets.slice().sort((a,b)=>Number(b.weight||0)-Number(a.weight||0)||Number(b.reps||0)-Number(a.reps||0))[0]||{};return{date:w.date,weight:Number(top.weight||0),reps:Number(top.reps||0),volume:vol(w.ex[name])}})}
function bars(series,key){if(!series.length)return '<div class="meta">No data yet.</div>';const vals=series.map(x=>Number(x[key]||0)),max=Math.max(...vals,1);return '<div class="chartWrap"><div class="chart"><div class="barrow">'+series.slice(-14).map(x=>'<div class="barcol"><span style="height:'+Math.max(2,Math.round(Number(x[key]||0)/max*125))+'px"></span><div class="barlabel">'+x.date.slice(5)+'</div></div>').join("")+'</div></div></div>'}
function renderProgress(){const ws=allWorkouts().filter(activeWorkout),completed=ws.filter(w=>w.completed).length,mins=ws.reduce((a,w)=>a+Number(w.elliptical||0),0),volume=ws.reduce((a,w)=>a+totalVolume(w),0),names=exerciseNames();let prs=names.map(n=>({n,b:bestFor(n)})).filter(x=>x.b).sort((a,b)=>b.b.weight-a.b.weight);let html='<div class="grid4"><div class="metric"><div class="meta">Workouts</div><div class="big">'+completed+'</div></div><div class="metric"><div class="meta">Elliptical</div><div class="big">'+mins+'</div><div class="tiny">minutes</div></div><div class="metric"><div class="meta">Total volume</div><div class="big">'+volume.toLocaleString()+'</div></div><div class="metric"><div class="meta">Longest streak</div><div class="big">'+longestStreak()+'</div></div></div>';
html+='<div class="card"><div class="sectionTitle">Exercise Progress</div><select id="exSelect" onchange="renderExerciseChart(this.value)"><option value="">Choose an exercise</option>'+names.map(n=>'<option>'+n+'</option>').join("")+'</select><div id="exChart" style="margin-top:12px"></div></div>';
html+='<div class="card"><div class="sectionTitle">Personal Records</div>';if(!prs.length)html+='<p class="meta">Your PR board will build as you log workouts.</p>';for(const x of prs)html+='<div class="historyItem"><div><b>'+x.n+'</b><div class="meta">'+x.b.date+'</div></div><div><b>'+x.b.weight+' lb × '+x.b.reps+'</b></div></div>';html+='</div>';
html+='<div class="card"><div class="sectionTitle">Body Weight</div><div class="grid2"><input id="bwInput" inputmode="decimal" placeholder="Weight"><button class="btn" onclick="addWeight()">Save Today\'s Weight</button></div>';const vals=db.bodyWeight.slice().sort((a,b)=>a.date.localeCompare(b.date));if(vals.length){html+='<div style="margin-top:12px" class="meta">Latest: '+vals[vals.length-1].weight+' lb';if(vals.length>1){const diff=(Number(vals[vals.length-1].weight)-Number(vals[0].weight)).toFixed(1);html+=' • Change: '+(diff>0?'+':'')+diff+' lb'}html+='</div>'+bars(vals.map(x=>({date:x.date,weight:Number(x.weight)})),"weight")}html+='</div>';content.innerHTML=html}
function renderExerciseChart(name){const el=document.getElementById("exChart");if(!name){el.innerHTML="";return}const s=progressSeries(name),first=s[0],last=s[s.length-1];let diff=last&&first?(last.weight-first.weight):0;el.innerHTML='<div class="grid3"><div class="metric"><div class="meta">First</div><div class="big">'+(first?first.weight:"-")+' lb</div></div><div class="metric"><div class="meta">Latest</div><div class="big">'+(last?last.weight:"-")+' lb</div></div><div class="metric"><div class="meta">Change</div><div class="big '+(diff>=0?'gain':'loss')+'">'+(diff>=0?'+':'')+diff+' lb</div></div></div><div class="sectionTitle" style="margin-top:12px">Weight trend</div>'+bars(s,"weight")+'<div class="sectionTitle" style="margin-top:12px">Volume trend</div>'+bars(s,"volume")}
function renderCompare(){const names=exerciseNames();let target=new Date();target.setHours(12,0,0,0);target.setDate(target.getDate()-30);const cutoff=iso(target),recent=allWorkouts().filter(w=>w.date>=cutoff&&activeWorkout(w)),older=allWorkouts().filter(w=>w.date<cutoff&&activeWorkout(w));let recentVol=recent.reduce((a,w)=>a+totalVolume(w),0),older30=older.slice(-recent.length),olderVol=older30.reduce((a,w)=>a+totalVolume(w),0),recentMin=recent.reduce((a,w)=>a+Number(w.elliptical||0),0),olderMin=older30.reduce((a,w)=>a+Number(w.elliptical||0),0);let html='<div class="card"><div class="sectionTitle">Last 30 Days vs Before</div><div class="grid3"><div class="metric"><div class="meta">Workouts</div><div class="big">'+recent.length+'</div><div class="tiny">previous comparable: '+older30.length+'</div></div><div class="metric"><div class="meta">Volume</div><div class="big">'+recentVol.toLocaleString()+'</div><div class="tiny">'+deltaText(recentVol,olderVol)+'</div></div><div class="metric"><div class="meta">Elliptical</div><div class="big">'+recentMin+' min</div><div class="tiny">'+deltaText(recentMin,olderMin)+'</div></div></div></div>';
html+='<div class="card"><div class="sectionTitle">Exercise Change</div><div class="meta">Latest logged weight compared with the closest entry at least 30 days earlier.</div>';for(const n of names){const s=progressSeries(n),latest=s[s.length-1];if(!latest)continue;const prior=s.filter(x=>x.date<=cutoff).pop();if(!prior)continue;const diff=latest.weight-prior.weight;html+='<div class="historyItem"><div><b>'+n+'</b><div class="meta">'+prior.date+' → '+latest.date+'</div></div><div><b class="'+(diff>=0?'gain':'loss')+'">'+(diff>=0?'+':'')+diff+' lb</b><div class="meta">'+prior.weight+' → '+latest.weight+'</div></div></div>'}html+='</div>';content.innerHTML=html}
function deltaText(a,b){if(!b)return "No earlier comparison yet";const p=((a-b)/b*100).toFixed(0);return (p>=0?"+":"")+p+"% vs prior period"}
function renderSummary(){const months={};for(const w of allWorkouts().filter(activeWorkout)){const m=w.date.slice(0,7);months[m]=months[m]||{workouts:0,elliptical:0,volume:0,prs:0};months[m].workouts++;months[m].elliptical+=Number(w.elliptical||0);months[m].volume+=totalVolume(w);for(const [n,e] of Object.entries(w.ex||{})){const prior=bestFor(n,w.date);if(e.weight&&( !prior||Number(e.weight)>prior.weight||(Number(e.weight)===prior.weight&&Number(e.reps||0)>prior.reps)))months[m].prs++}}let html='<div class="card"><div class="sectionTitle">Monthly Summaries</div><div class="meta">A running month-by-month view of your training.</div>';for(const m of Object.keys(months).sort().reverse()){const x=months[m],d=new Date(m+"-01T12:00:00"),label=d.toLocaleDateString(undefined,{month:"long",year:"numeric"});html+='<div class="historyItem"><div><b>'+label+'</b><div class="meta">'+x.workouts+' workout days • '+x.prs+' PRs</div></div><div style="text-align:right"><b>'+x.elliptical+' min</b><div class="meta">'+x.volume.toLocaleString()+' volume</div></div></div>'}if(!Object.keys(months).length)html+='<p class="meta">Your first monthly summary will appear as you log workouts.</p>';html+='</div>';content.innerHTML=html}
function renderData(){content.innerHTML='<div class="card"><div class="sectionTitle">Backup & Restore</div><p class="meta">Your workout history is stored on this device. Download a backup occasionally so you can recover it after changing phones or clearing browser data.</p><div class="actions"><button class="btn" onclick="exportData()">Download Backup</button><button class="btn secondary" onclick="document.getElementById(\'restoreFile\').click()">Restore Backup</button></div><input id="restoreFile" type="file" accept="application/json" style="display:none" onchange="restoreData(this.files[0])"></div><div class="card"><div class="sectionTitle">Elliptical Goal</div><div class="grid2"><input id="goalInput" inputmode="numeric" value="'+(db.settings.ellipticalGoal||60)+'"><button class="btn" onclick="saveGoal()">Save Goal</button></div></div><div class="card"><div class="sectionTitle">Water Goal</div><div class="grid2"><select id="waterServings"><option value="12" '+(Number(db.settings.waterServings||12)===12?'selected':'')+'>12 servings = 120 oz</option><option value="14" '+(Number(db.settings.waterServings||12)===14?'selected':'')+'>14 servings = 140 oz</option></select><button class="btn" onclick="saveWaterGoal()">Save Water Goal</button></div><div class="meta" style="margin-top:8px">Each check = 10 oz.</div></div><div class="card"><div class="sectionTitle">Security</div><div class="meta">PIN lock is enabled for this browser session. Closing the app/browser tab locks it again.</div><button class="btn secondary" style="margin-top:10px" onclick="lockNow()">Lock Now</button></div><div class="card"><div class="sectionTitle">Storage</div><div class="meta">'+allWorkouts().filter(activeWorkout).length+' workout days saved on this device.</div></div>'}
function upd(k,v){workout()[k]=v;save();renderToday()}function updEx(n,k,v){const w=workout();w.ex[n]=w.ex[n]||{};w.ex[n][k]=v;save()}function toggleEx(n){const w=workout();w.ex[n]=w.ex[n]||{};w.ex[n].done=!w.ex[n].done;save();renderToday()}function finish(){workout().completed=true;save();render()}function clearDate(){if(confirm("Clear all entries for "+fmt(currentDate)+"?")){delete db.workouts[iso(currentDate)];save();render()}}
function openDate(k){currentDate=new Date(k+"T12:00:00");view="today";render()}function goPrev(){currentDate.setDate(currentDate.getDate()-1);view="today";render()}function goNext(){currentDate.setDate(currentDate.getDate()+1);view="today";render()}function goToday(){currentDate=new Date();currentDate.setHours(12,0,0,0);view="today";render()}
function addWeight(){const v=document.getElementById("bwInput").value;if(!v)return;const k=iso(new Date()),old=db.bodyWeight.find(x=>x.date===k);if(old)old.weight=v;else db.bodyWeight.push({date:k,weight:v});save();renderProgress()}
function saveGoal(){db.settings.ellipticalGoal=Number(document.getElementById("goalInput").value||60);save();renderData()}function saveWaterGoal(){db.settings.waterServings=Number(document.getElementById("waterServings").value||12);db.settings.waterOzPerServing=10;for(const w of Object.values(db.workouts)){w.water=Array.isArray(w.water)?w.water:[];if(w.water.length>db.settings.waterServings)w.water=w.water.slice(0,db.settings.waterServings)}save();renderData()}
function exportData(){const payload={version:4,exportedAt:new Date().toISOString(),data:db};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="josh-gym-backup-"+iso(new Date())+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restoreData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result),incoming=x.data||x;if(!incoming.workouts)throw 0;if(!confirm("Restore this backup and replace the data currently on this device?"))return;db=incoming;db.workouts=db.workouts||{};db.bodyWeight=db.bodyWeight||[];db.settings=db.settings||{ellipticalGoal:60};save();alert("Backup restored.");render()}catch(e){alert("That backup file could not be read.")}};r.readAsText(file)}
function lockNow(){sessionStorage.removeItem("joshGymUnlocked");app.classList.add("hidden");lockScreen.classList.remove("hidden");pinInput.value="";pinMsg.textContent="";pinInput.focus()}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js?v=15");
initLock();
