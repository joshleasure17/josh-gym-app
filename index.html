<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#4b1f6f" />
  <title>Josh's Gym Plan</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    :root{--bg:#111;--card:#1b1b1f;--muted:#aaa;--text:#fff;--accent:#7b3fb8;--accent2:#b78ae0;--ok:#2f9e44}
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#241033,#111 35%);color:var(--text)}
    .wrap{max-width:760px;margin:auto;padding:16px 14px 90px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
    h1{font-size:1.6rem;margin:8px 0} .sub{color:var(--muted);font-size:.95rem}
    .tabs{display:flex;gap:8px;overflow:auto;padding:12px 0}.tab{border:0;border-radius:999px;padding:10px 14px;background:#2a2530;color:#ddd;white-space:nowrap}
    .tab.active{background:var(--accent);color:#fff}.card{background:rgba(27,27,31,.96);border:1px solid #342d3d;border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 8px 22px rgba(0,0,0,.22)}
    .row{display:grid;grid-template-columns:1fr 78px 78px 42px;gap:8px;align-items:center;margin-top:10px}
    .name{font-weight:700}.meta{color:var(--muted);font-size:.86rem}.row input{width:100%;padding:10px;border-radius:10px;border:1px solid #444;background:#121217;color:#fff}
    .check{width:34px;height:34px;border-radius:10px;border:1px solid #555;background:#18181d;color:white;font-size:18px}.check.done{background:var(--ok);border-color:var(--ok)}
    .elliptical{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{font-size:1.7rem;font-weight:800}.progress{height:12px;background:#2a2a2f;border-radius:999px;overflow:hidden;margin-top:10px}
    .bar{height:100%;background:var(--accent2);width:0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:12px;padding:12px;background:var(--accent);color:#fff;font-weight:700}
    .btn.secondary{background:#2b2830}.footer{position:fixed;left:0;right:0;bottom:0;background:#151217ee;border-top:1px solid #302736;padding:10px;backdrop-filter:blur(10px)}
    .footer .inner{max-width:760px;margin:auto;display:flex;gap:8px}.footer button{flex:1}.tiny{font-size:.78rem;color:#999}.sectionTitle{font-size:1.05rem;font-weight:800;margin:0 0 4px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1>Josh's Gym Plan</h1><div class="sub">Planet Fitness • 7 days • 60 min elliptical daily</div></div><div class="tiny" id="streak"></div></div>
  <div class="tabs" id="tabs"></div>
  <div id="content"></div>
</div>
<div class="footer"><div class="inner"><button class="btn secondary" onclick="exportData()">Backup</button><button class="btn" onclick="showProgress()">Progress</button></div></div>
<script>
const plan = {
Monday:{focus:"Chest + Triceps",ex:[["Smith Machine Bench Press","3 x 8-10"],["Incline Chest Press Machine","3 x 10"],["Pec Deck","3 x 12"],["Cable Triceps Pushdown","3 x 12"],["Overhead Cable Triceps Extension","3 x 10"]]},
Tuesday:{focus:"Back + Biceps",ex:[["Lat Pulldown","3 x 10"],["Seated Row Machine","3 x 10"],["Assisted Pull-Up Machine","3 x 8-10"],["Reverse Pec Deck","3 x 12"],["Cable Curl","3 x 10"],["Dumbbell Hammer Curl","3 x 10"]]},
Wednesday:{focus:"Legs",ex:[["Leg Press","4 x 10"],["Smith Machine Squat","3 x 8-10"],["Seated Leg Curl","3 x 12"],["Leg Extension","3 x 12"],["Calf Raise on Leg Press","4 x 15"]]},
Thursday:{focus:"Core + Recovery",ex:[["Ab Crunch Machine","3 x 12-15"],["Cable Woodchop","3 x 10/side"],["Plank","3 x 30-60 sec"],["Dead Bug","3 x 10/side"]]},
Friday:{focus:"Shoulders + Arms",ex:[["Shoulder Press Machine","3 x 10"],["Dumbbell Lateral Raise","3 x 12"],["Reverse Pec Deck","3 x 12"],["Cable Curl","3 x 10"],["Rope Triceps Pushdown","3 x 10"],["Preacher Curl Machine","2 x 12"],["Triceps Press Machine","2 x 12"]]},
Saturday:{focus:"Full Body",ex:[["Smith Machine Squat","3 x 8"],["Chest Press Machine","3 x 10"],["Lat Pulldown","3 x 10"],["Dumbbell Romanian Deadlift","3 x 10"],["Shoulder Press Machine","2 x 10"],["Cable Row","2 x 12"]]},
Sunday:{focus:"Active Recovery",ex:[["Mobility / Stretching","10-15 min"],["Easy Walk","Optional"]]}
};
const days=Object.keys(plan); let selected=days[new Date().getDay()===0?6:new Date().getDay()-1];
const storeKey="joshGymDataV2"; let data=JSON.parse(localStorage.getItem(storeKey)||"{}");
function save(){localStorage.setItem(storeKey,JSON.stringify(data))}
function dayKey(d){return d}
function ensure(d){data[d]=data[d]||{elliptical:0,level:"",notes:"",ex:{},completed:false,date:new Date().toISOString().slice(0,10)};return data[d]}
function renderTabs(){tabs.innerHTML=days.map(d=>'<button class="tab '+(d===selected?'active':'')+'" onclick="selected=\''+d+'\';render()">'+d.slice(0,3)+'</button>').join("")}
function lastFor(name,currentDay){for(let i=days.indexOf(currentDay)-1;i>=0;i--){let v=data[days[i]]?.ex?.[name];if(v&&(v.weight||v.reps))return v}return null}
function render(){
 renderTabs(); const p=plan[selected], s=ensure(selected);
 let exHtml=p.ex.map(([name,target])=>{const e=s.ex[name]||{};const last=lastFor(name,selected);return '<div class="card"><div class="name">'+name+'</div><div class="meta">'+target+(last?' • Last: '+(last.weight||'-')+' lb x '+(last.reps||'-'):'')+'</div><div class="row"><div></div><input placeholder="Weight" inputmode="decimal" value="'+(e.weight||'')+'" onchange="updEx(\''+esc(name)+'\',\'weight\',this.value)"><input placeholder="Reps" inputmode="numeric" value="'+(e.reps||'')+'" onchange="updEx(\''+esc(name)+'\',\'reps\',this.value)"><button class="check '+(e.done?'done':'')+'" onclick="toggleEx(\''+esc(name)+'\')">'+(e.done?'✓':'')+'</button></div></div>'}).join("");
 const pct=Math.min(100,Math.round((Number(s.elliptical||0)/60)*100));
 content.innerHTML='<div class="card"><div class="sectionTitle">'+selected+' — '+p.focus+'</div><div class="meta">Strength work + daily elliptical goal</div></div>'
 +'<div class="card"><div class="sectionTitle">Elliptical</div><div class="big">'+(s.elliptical||0)+' / 60 min</div><div class="progress"><div class="bar" style="width:'+pct+'%"></div></div><div class="elliptical" style="margin-top:12px"><input placeholder="Minutes" inputmode="numeric" value="'+(s.elliptical||'')+'" onchange="upd(\'elliptical\',this.value)"><input placeholder="Resistance / Level" value="'+(s.level||'')+'" onchange="upd(\'level\',this.value)"></div></div>'
 +exHtml+'<div class="card"><div class="sectionTitle">Notes</div><textarea style="width:100%;min-height:90px;border-radius:12px;padding:10px;background:#121217;color:#fff;border:1px solid #444" onchange="upd(\'notes\',this.value)">'+(s.notes||'')+'</textarea><div class="actions" style="margin-top:10px"><button class="btn secondary" onclick="resetDay()">Reset Day</button><button class="btn" onclick="finishDay()">Finish Workout</button></div></div>';
 streak.textContent=(data[selected]?.completed?'Completed ✓':'');
}
function esc(s){return s.replaceAll("\\","\\\\").replaceAll("'","\\'")}
function upd(k,v){ensure(selected)[k]=v;save();render()}
function updEx(n,k,v){let s=ensure(selected);s.ex[n]=s.ex[n]||{};s.ex[n][k]=v;save()}
function toggleEx(n){let s=ensure(selected);s.ex[n]=s.ex[n]||{};s.ex[n].done=!s.ex[n].done;save();render()}
function finishDay(){ensure(selected).completed=true;save();render()}
function resetDay(){if(confirm("Reset this day's entries?")){delete data[selected];save();render()}}
function showProgress(){let c=days.filter(d=>data[d]?.completed).length;let mins=days.reduce((a,d)=>a+Number(data[d]?.elliptical||0),0);alert("Workouts completed: "+c+"/7\nElliptical minutes logged: "+mins+"\nElliptical goal: 420 min/week")}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="josh-gym-backup.json";a.click();URL.revokeObjectURL(a.href)}
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
render();
</script>
</body>
</html>
